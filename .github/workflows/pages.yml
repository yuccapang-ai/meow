# 把 app/ 目录（即最终 zip 的内容）发布到 GitHub Pages
# 首次需在仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/engine.test.js
      - run: node tools/cat-collection.test.js
      - run: node tools/series-ui.test.js
      - run: node tools/cat-actions.test.js
      - run: node tools/cat-travel.test.js
      - run: node tools/cat-energy.test.js
      - run: node tools/room-residents.test.js
      - run: node tools/room-residents.test.js
        env:
          ROOM_TEST_SERIES: all
      - run: node tools/room-life.test.js
      - run: node tools/room-arrange.test.js
      - run: node tools/audit-pages.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # 首次自动开启 Pages（Source = GitHub Actions）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
